name: Build VULCAN VST3 for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release VST3
        run: cmake --build build --config Release --target VulcanByDJSmartie_VST3

      - name: Upload VST3 Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VULCAN-by-DJSmartie-Windows-VST3
          path: build/VulcanByDJSmartie_artefacts/Release/VST3/
