name: Build VULCAN VST3 for Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      -up MSVC environment      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      -Pluginswith:
          name: VULCAN-by-DJSmartie-Windows-VST3
          path: build/VulcanByDJSmartie_artefacts/Release/
